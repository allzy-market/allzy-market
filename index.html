<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allzy Market | Shop Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Allzy Market</h1>
    <p>Your marketplace. More choices, better shopping.</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to Allzy Market!</h2>
      <p>Discover products from different sellers in one place.</p>
      <p>Shop fashion, bags, shoes and more.</p>
    </section>

    <section>
      <h2>Explore Products</h2>
      <div id="products"></div>
    </section>
    <section class="cart-section">
  <h2>🛒 Your Shopping Cart</h2>
  <div id="cart-items">
    <p>Your cart is empty.</p>
  </div>
  <h3 id="cart-total">Total: ₦0</h3>
  <button id="checkout-button" onclick="checkout()">
    Proceed to Checkout
  </button>
</section>
  </main>

  <footer>
